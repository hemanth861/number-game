<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔢 Number Guessing Game</h1>
            <p class="subtitle">Guess a number between 1 and 100</p>
        </header>

        <div class="character-section">
            <div class="character" id="character">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Character body -->
                    <circle cx="100" cy="80" r="35" fill="#fdbcb4" stroke="#d4a574" stroke-width="2"/>
                    <!-- Hair -->
                    <path d="M 65 75 Q 100 45 135 75 Q 130 55 100 50 Q 70 55 65 75" fill="#8b4513"/>
                    <!-- Eyes -->
                    <circle cx="85" cy="75" r="6" fill="#333"/>
                    <circle cx="115" cy="75" r="6" fill="#333"/>
                    <circle cx="87" cy="73" r="2" fill="white"/>
                    <circle cx="117" cy="73" r="2" fill="white"/>
                    <!-- Eyebrows -->
                    <path d="M 78 68 Q 85 65 92 68" stroke="#8b4513" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M 108 68 Q 115 65 122 68" stroke="#8b4513" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <!-- Mouth -->
                    <path id="mouth" d="M 95 90 Q 100 95 105 90" stroke="#d2691e" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <!-- Body -->
                    <rect x="85" y="115" width="30" height="40" rx="10" fill="#667eea" stroke="#4c63d2" stroke-width="2"/>
                    <!-- Arms -->
                    <line x1="75" y1="125" x2="60" y2="140" stroke="#fdbcb4" stroke-width="12" stroke-linecap="round"/>
                    <line x1="125" y1="125" x2="140" y2="140" stroke="#fdbcb4" stroke-width="12" stroke-linecap="round"/>
                    <!-- Legs -->
                    <line x1="92" y1="155" x2="88" y2="175" stroke="#fdbcb4" stroke-width="12" stroke-linecap="round"/>
                    <line x1="108" y1="155" x2="112" y2="175" stroke="#fdbcb4" stroke-width="12" stroke-linecap="round"/>
                    <!-- Shoes -->
                    <ellipse cx="88" cy="180" rx="8" ry="5" fill="#333"/>
                    <ellipse cx="112" cy="180" rx="8" ry="5" fill="#333"/>
                </svg>
            </div>
            <p class="character-message" id="characterMessage">Let's find that number!</p>
        </div>

        <div class="game-stats">
            <div class="stat-card">
                <span class="stat-label">Attempts</span>
                <span class="stat-value" id="attempts">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">High Score</span>
                <span class="stat-value" id="highScore">-</span>
            </div>
        </div>

        <div class="difficulty-section">
            <label for="difficulty" class="difficulty-label">Difficulty:</label>
            <select id="difficulty" class="difficulty-select">
                <option value="easy">Easy (Unlimited)</option>
                <option value="medium" selected>Medium (10 attempts)</option>
                <option value="hard">Hard (5 attempts)</option>
            </select>
        </div>

        <div class="game-area">
            <div class="input-group">
                <input 
                    type="number" 
                    id="guessInput" 
                    class="guess-input" 
                    min="1" 
                    max="100" 
                    placeholder="Enter your guess..."
                    autocomplete="off"
                >
                <button id="guessBtn" class="guess-btn">Guess</button>
            </div>

            <div class="controls">
                <button id="newGameBtn" class="control-btn">New Game</button>
                <button id="hintBtn" class="control-btn">Give Hint</button>
            </div>
        </div>

        <div class="message-section">
            <p id="message" class="message"></p>
        </div>

        <div class="history-section">
            <h2>Your Guesses</h2>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
